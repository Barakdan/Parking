<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Can I Park Here?</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #111827;
      }

      main {
        width: min(100%, 40rem);
        padding: 2rem;
        text-align: center;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 5vw, 2.75rem);
        line-height: 1.05;
      }

      p {
        margin: 0;
        color: #475569;
      }

      .button-link {
        display: inline-flex;
        width: min(80vw, 20rem);
        aspect-ratio: 1 / 1;
        margin-top: 2rem;
        border-radius: 50%;
        background: #0f172a;
        color: #ffffff;
        text-decoration: none;
        font-weight: 700;
        font-size: clamp(1rem, 2vw, 1.3rem);
        justify-content: center;
        align-items: center;
        border: none;
        cursor: pointer;
        text-align: center;
        white-space: pre-line;
        padding: 0;
      }

      .button-link:hover,
      .button-link:focus-visible {
        background: #111827;
        outline: none;
      }

      .button-link.verdict-allowed,
      .button-link.verdict-allowed:hover,
      .button-link.verdict-allowed:focus-visible {
        background: #15803d;
        box-shadow: 0 1.25rem 3rem rgb(21 128 61 / 24%);
      }

      .button-link.verdict-prohibited,
      .button-link.verdict-prohibited:hover,
      .button-link.verdict-prohibited:focus-visible {
        background: #b91c1c;
        box-shadow: 0 1.25rem 3rem rgb(185 28 28 / 24%);
      }

      .button-link.verdict-uncertain,
      .button-link.verdict-uncertain:hover,
      .button-link.verdict-uncertain:focus-visible {
        background: #b45309;
        box-shadow: 0 1.25rem 3rem rgb(180 83 9 / 24%);
      }

      .button-link:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .location-select {
        display: block;
        width: min(100%, 22rem);
        margin: 1rem auto 0;
        padding: 0.85rem 1rem;
        border-radius: 1rem;
        border: 1px solid #cbd5e1;
        font-size: 1rem;
        color: #0f172a;
        background: #ffffff;
      }

      .note {
        max-width: 34rem;
        margin: 1.25rem auto 0;
        color: #64748b;
        font-size: 1rem;
        line-height: 1.55;
        white-space: pre-wrap;
      }

      .verdict-details {
        display: grid;
        gap: 0.85rem;
        text-align: left;
      }

      .verdict-section {
        padding: 0.9rem 1rem;
        border: 1px solid #e2e8f0;
        border-radius: 0.9rem;
        background: #ffffff;
      }

      .verdict-section-title {
        display: block;
        margin-bottom: 0.3rem;
        color: #0f172a;
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .verdict-rules {
        margin: 0;
        padding-left: 1.2rem;
      }

      .verdict-rules li + li {
        margin-top: 0.4rem;
      }

      .sign-text {
        direction: auto;
        unicode-bidi: plaintext;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Can I Park Here?</h1>
      <p>Check your current location or choose a test location.</p>
      <label for="locationSelect" class="note">Location source:</label>
      <select id="locationSelect" class="location-select">
        <option value="">My current location (default)</option>
        <option value="32.07501,34.77751">Dizengoff Square</option>
        <option value="32.06649,34.77750">Rothschild Boulevard</option>
        <option value="32.09019,34.77402">Tel Aviv Port</option>
      </select>
      <button id="checkButton" class="button-link" type="button">
        Check Parking Here
      </button>
      <input id="photoInput" type="file" accept="image/*" hidden />
      <div id="status" class="note">Checking configuration…</div>
    </main>
    <script type="module">
      import { gps as readPhotoGps } from 'exifr';

      const button = document.getElementById('checkButton');
      const status = document.getElementById('status');
      const locationSelect = document.getElementById('locationSelect');
      const apiUrl = import.meta.env.VITE_API_URL;

      function setStatus(message, isError = false) {
        status.classList.remove('verdict-details');
        status.textContent = message;
        status.style.color = isError ? '#b91c1c' : '#64748b';
      }

      function setButtonState(state, text) {
        button.classList.remove('verdict-allowed', 'verdict-prohibited', 'verdict-uncertain');
        if (state) button.classList.add(`verdict-${state}`);
        button.textContent = text;
      }

      function verdictDetails(data) {
        const explanations = Array.isArray(data.explanation) ? data.explanation : [];
        const decisionReason = [...explanations].reverse().find((line) =>
          /prohibit|permit|allowed|requires|could not|not visible|not recognized|evidence/i.test(line)
        );
        const rules = [];
        const sign = data.signAnalysis;

        if (sign) {
          const ruleParts = [];
          if (sign.loadingOnly) {
            ruleParts.push('allows stopping only for active loading and unloading');
          } else if (sign.disabledPermitRequired) {
            const reservedArea = sign.disabledSpaceDescription || (sign.reservedDisabledSpaces
              ? `${sign.reservedDisabledSpaces} marked space${sign.reservedDisabledSpaces === 1 ? '' : 's'}`
              : null);
            ruleParts.push(reservedArea
              ? `reserves ${reservedArea} for disabled-permit vehicles; ordinary parking may use only the remaining spaces`
              : 'reserves this parking area for disabled-permit vehicles');
          } else if (sign.generalParkingAllowed === true) {
            ruleParts.push('allows ordinary parking');
          } else if (sign.generalParkingAllowed === false) {
            ruleParts.push('does not allow ordinary parking');
          } else if (sign.parkingPermitted === true) {
            ruleParts.push('allows parking with conditions');
          }
          if (sign.parkingPermitted === false) ruleParts.push('prohibits parking');

          if (sign.residentPermitZones?.length) {
            ruleParts.push(`for permit zone ${sign.residentPermitZones.join(', ')}`);
          }

          if (sign.restrictionStart && sign.restrictionEnd) {
            ruleParts.push(`from ${sign.restrictionStart} to ${sign.restrictionEnd}`);
          }

          if (sign.applicableWeekdays?.length) {
            const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const days = sign.applicableWeekdays.map((day) => dayNames[day]).filter(Boolean);
            if (days.length) ruleParts.push(`on ${days.join(', ')}`);
          }

          if (ruleParts.length) {
            rules.push(`The sign ${ruleParts.join(' ')}.`);
          }

          const transcribedLines = String(sign.rawText || '')
            .split(/\n+/)
            .map((line) => line.replace(/\s+/g, ' ').trim())
            .filter(Boolean);
          for (const line of transcribedLines.slice(0, 6)) {
            rules.push(`Sign text: “${line.length > 180 ? line.slice(0, 177) + '…' : line}”`);
          }
        }

        if (decisionReason) rules.push(decisionReason);

        if (data.decision !== 'uncertain' && data.warnings?.length > 1) {
          rules.push(data.warnings.at(-1));
        }

        const payment = data.decision === 'prohibited'
          ? 'Do not activate payment because parking is not permitted for this vehicle.'
          : data.paymentAppMustBeActivated
            ? 'Activate a parking payment app now.'
            : data.decision === 'allowed'
              ? 'No parking payment is required right now.'
              : 'Payment cannot be determined until the sign is verified.';

        return {
          confidence: data.confidence
            ? `${data.confidence.level[0].toUpperCase() + data.confidence.level.slice(1)} · ${data.confidence.score}% — ${data.confidence.reason}`
            : 'Not available',
          payment,
          rules: rules.length ? rules : ['The sign could not be interpreted safely.'],
        };
      }

      function showVerdictDetails(data, isError) {
        const details = verdictDetails(data);
        status.replaceChildren();
        status.classList.add('verdict-details');
        status.style.color = isError ? '#991b1b' : '#334155';

        const addSection = (title, content) => {
          const section = document.createElement('section');
          section.className = 'verdict-section';
          const heading = document.createElement('strong');
          heading.className = 'verdict-section-title';
          heading.textContent = title;
          section.append(heading, content);
          status.append(section);
        };

        const confidence = document.createElement('span');
        confidence.textContent = details.confidence;
        addSection('Confidence', confidence);

        const payment = document.createElement('span');
        payment.textContent = details.payment;
        addSection('Payment', payment);

        const rules = document.createElement('ul');
        rules.className = 'verdict-rules';
        for (const rule of details.rules) {
          const item = document.createElement('li');
          item.textContent = rule;
          if (rule.startsWith('Sign text:')) item.className = 'sign-text';
          rules.append(item);
        }
        addSection('Rules', rules);
      }

      function showVerdict(data) {
        if (data.decision === 'allowed') {
          setButtonState('allowed', 'YES\nParking Allowed');
          showVerdictDetails(data, false);
          return;
        }
        if (data.decision === 'prohibited') {
          setButtonState('prohibited', 'NO\nDo Not Park');
          showVerdictDetails(data, true);
          return;
        }

        setButtonState('uncertain', 'NOT SURE\nTry Another Photo');
        showVerdictDetails(data, true);
      }

      function parseLocation(value) {
        const [lat, lng] = value.split(',').map((v) => Number(v.trim()));
        return { latitude: lat, longitude: lng };
      }

      function getCurrentLocation() {
        return new Promise((resolve, reject) => {
          if (!navigator.geolocation) {
            reject(new Error('Geolocation is not supported by this device. Choose a test location instead.'));
            return;
          }

          navigator.geolocation.getCurrentPosition(
            (position) => resolve({
              latitude: position.coords.latitude,
              longitude: position.coords.longitude,
              gpsAccuracyMeters: position.coords.accuracy,
            }),
            (error) => {
              const message = error.code === error.PERMISSION_DENIED
                ? 'Location permission was denied. Allow location access or choose a test location.'
                : 'Your location could not be determined. Try again or choose a test location.';
              reject(new Error(message));
            },
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 },
          );
        });
      }

      setStatus(
        apiUrl
          ? 'Ready. Tap the button and allow location access, or choose a test location.'
          : 'VITE_API_URL is not configured at build time. Check frontend Render env.',
        !apiUrl
      );

      let photoRequired = false;
      let requestInFlight = false;
      let activeLocation = null;
      const photoInput = document.getElementById('photoInput');

      async function readResponse(response) {
        const text = await response.text();
        if (!text) return {};
        try {
          return JSON.parse(text);
        } catch {
          throw new Error(`Backend returned an invalid response (${response.status}).`);
        }
      }

      async function prepareImage(file) {
        let photoGps = null;
        try {
          photoGps = await readPhotoGps(file);
        } catch {
          // The backend treats missing GPS as lower-confidence evidence.
        }

        const compressedImage = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onerror = () => reject(new Error('Could not read the selected photo.'));
          reader.onload = () => {
            const image = new Image();
            image.onerror = () => reject(new Error('The selected file is not a readable image.'));
            image.onload = () => {
              const maxDimension = 2200;
              const scale = Math.min(1, maxDimension / Math.max(image.width, image.height));
              const canvas = document.createElement('canvas');
              canvas.width = Math.max(1, Math.round(image.width * scale));
              canvas.height = Math.max(1, Math.round(image.height * scale));
              canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
              const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
              resolve({ mimeType: 'image/jpeg', base64: dataUrl.split(',')[1] ?? '' });
            };
            image.src = String(reader.result);
          };
          reader.readAsDataURL(file);
        });

        const prepared = {
          ...compressedImage,
        };

        if (photoGps && Number.isFinite(photoGps.latitude) && Number.isFinite(photoGps.longitude)) {
          prepared.photoLocation = {
            latitude: photoGps.latitude,
            longitude: photoGps.longitude,
          };
        }

        return prepared;
      }

      async function sendLocation(position) {
        if (!apiUrl) {
          setStatus('VITE_API_URL is not configured. Check your build settings.', true);
          button.disabled = false;
          return;
        }

        const payload = {
          latitude: position.latitude,
          longitude: position.longitude,
          gpsAccuracyMeters: position.gpsAccuracyMeters ?? 10,
          isTelAvivResident: false,
          residentPermitZone: '',
          hasDisabledParkingPermit: false,
          isActivelyLoading: false,
          locationOnly: true,
        };

        try {
          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });

          const data = await readResponse(response);
          if (!response.ok) {
            setStatus(data.error || 'Parking check failed', true);
            return;
          }

          if (data.cacheHit) {
            showVerdict(data);
          } else if (data.needsPhoto) {
            photoRequired = true;
            setButtonState(null, 'Choose signpost photo');
            setStatus('Photo required. Take a new photo or choose an existing signpost photo.', false);
          } else {
            showVerdict(data);
          }
        } catch (error) {
          setStatus(error instanceof Error ? error.message : 'Unable to reach backend', true);
        } finally {
          button.disabled = false;
        }
      }

      button.addEventListener('click', async () => {
        if (requestInFlight) return;
        if (!apiUrl) {
          setStatus('VITE_API_URL is not configured at build time. Check frontend Render env.', true);
          return;
        }

        if (photoRequired) {
          photoInput.click();
          return;
        }

        button.disabled = true;
        requestInFlight = true;
        setButtonState(null, locationSelect.value ? 'Checking…' : 'Locating…');
        setStatus(locationSelect.value ? 'Checking test location…' : 'Getting your current location…');

        try {
          activeLocation = locationSelect.value
            ? { ...parseLocation(locationSelect.value), gpsAccuracyMeters: 10 }
            : await getCurrentLocation();
          setButtonState(null, 'Checking…');
          setStatus('Checking parking rules at this location…');
          await sendLocation(activeLocation);
        } catch (error) {
          setButtonState(null, 'Check Parking Here');
          setStatus(error instanceof Error ? error.message : 'Unable to determine location.', true);
          button.disabled = false;
        } finally {
          requestInFlight = false;
        }
      });

      locationSelect.addEventListener('change', () => {
        activeLocation = null;
        photoRequired = false;
        setButtonState(null, 'Check Parking Here');
        setStatus(
          locationSelect.value
            ? 'Test location selected. Tap the button to check it.'
            : 'Current location selected. Tap the button and allow location access.',
          false,
        );
      });

      photoInput.addEventListener('change', async () => {
        if (requestInFlight) return;
        const file = photoInput.files?.[0];
        if (!file) {
          setStatus('No photo selected.', true);
          return;
        }

        if (!apiUrl) {
          setStatus('VITE_API_URL is not configured. Check your build settings.', true);
          return;
        }

        if (!activeLocation) {
          setStatus('Check a location before uploading a signpost photo.', true);
          photoRequired = false;
          setButtonState(null, 'Check Parking Here');
          return;
        }

        if (!file.type.startsWith('image/')) {
          setStatus('Please select an image file.', true);
          return;
        }

        requestInFlight = true;
        button.disabled = true;
        setButtonState(null, 'Analyzing…');
        setStatus('Uploading signpost photo…');

        try {
            const preparedImage = await prepareImage(file);
            const response = await fetch(apiUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                latitude: activeLocation.latitude,
                longitude: activeLocation.longitude,
                gpsAccuracyMeters: activeLocation.gpsAccuracyMeters ?? 10,
                isTelAvivResident: false,
                residentPermitZone: '',
                hasDisabledParkingPermit: false,
                isActivelyLoading: false,
                locationOnly: false,
                signImages: [preparedImage],
              }),
            });

            const data = await readResponse(response);
            if (!response.ok) {
              setStatus(data.error || 'Photo upload failed', true);
              photoRequired = true;
              setButtonState(null, 'Choose signpost photo');
              return;
            }

            if (data.needsPhoto || data.decision === 'uncertain') {
              photoRequired = true;
              showVerdict(data);
            } else {
              photoRequired = false;
              showVerdict(data);
            }
          } catch (error) {
            setStatus(error instanceof Error ? error.message : 'Unable to reach backend', true);
            photoRequired = true;
            setButtonState(null, 'Choose signpost photo');
          } finally {
            requestInFlight = false;
            button.disabled = false;
            photoInput.value = '';
          }
      });
    </script>
  </body>
</html>
