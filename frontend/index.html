<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Can I Park Here?</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #111827;
      }

      main {
        width: min(100%, 40rem);
        padding: 2rem;
        text-align: center;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 5vw, 2.75rem);
        line-height: 1.05;
      }

      p {
        margin: 0;
        color: #475569;
      }

      .button-link {
        display: inline-flex;
        width: min(80vw, 20rem);
        aspect-ratio: 1 / 1;
        margin-top: 2rem;
        border-radius: 50%;
        background: #0f172a;
        color: #ffffff;
        text-decoration: none;
        font-weight: 700;
        font-size: clamp(1rem, 2vw, 1.3rem);
        justify-content: center;
        align-items: center;
        border: none;
        cursor: pointer;
        text-align: center;
        padding: 0;
      }

      .button-link:hover,
      .button-link:focus-visible {
        background: #111827;
        outline: none;
      }

      .button-link:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .location-select {
        display: block;
        width: min(100%, 22rem);
        margin: 1rem auto 0;
        padding: 0.85rem 1rem;
        border-radius: 1rem;
        border: 1px solid #cbd5e1;
        font-size: 1rem;
        color: #0f172a;
        background: #ffffff;
      }

      .note {
        margin-top: 1rem;
        color: #64748b;
        font-size: 0.95rem;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Can I Park Here?</h1>
      <p>Use a Tel Aviv test location and send it to the backend.</p>
      <label for="locationSelect" class="note">Select a Tel Aviv test location:</label>
      <select id="locationSelect" class="location-select">
        <option value="32.07501,34.77751">Dizengoff Square</option>
        <option value="32.06649,34.77750">Rothschild Boulevard</option>
        <option value="32.09019,34.77402">Tel Aviv Port</option>
      </select>
      <button id="checkButton" class="button-link" type="button">
        Check Parking Here
      </button>
      <p id="status" class="note">Checking configuration…</p>
    </main>
    <script type="module">
      const button = document.getElementById('checkButton');
      const status = document.getElementById('status');
      const locationSelect = document.getElementById('locationSelect');
      const apiUrl = import.meta.env.VITE_API_URL;

      function setStatus(message, isError = false) {
        status.textContent = message;
        status.style.color = isError ? '#b91c1c' : '#64748b';
      }

      function parseLocation(value) {
        const [lat, lng] = value.split(',').map((v) => Number(v.trim()));
        return { latitude: lat, longitude: lng };
      }

      setStatus(
        apiUrl
          ? 'Ready. Tap the button to send a Tel Aviv test location.'
          : 'VITE_API_URL is not configured at build time. Check frontend Render env.',
        !apiUrl
      );

      async function sendLocation(position) {
        if (!apiUrl) {
          setStatus('VITE_API_URL is not configured. Check your build settings.', true);
          button.disabled = false;
          return;
        }

        const payload = {
          latitude: position.latitude,
          longitude: position.longitude,
          gpsAccuracyMeters: 10,
          isTelAvivResident: false,
          residentPermitZone: '',
          locationOnly: true,
        };

        try {
          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });

          const data = await response.json();
          if (!response.ok) {
            setStatus(data.error || 'Parking check failed', true);
            return;
          }

          if (data.cacheHit) {
            setStatus('Cached sign found: ' + (data.message ?? 'parking evaluation returned'), false);
          } else if (data.needsPhoto) {
            setStatus('No cached sign nearby. Photo is needed.', false);
          } else {
            setStatus('Parking result: ' + JSON.stringify(data), false);
          }
        } catch (error) {
          setStatus(error instanceof Error ? error.message : 'Unable to reach backend', true);
        } finally {
          button.disabled = false;
        }
      }

      button.addEventListener('click', () => {
        if (!apiUrl) {
          setStatus('VITE_API_URL is not configured at build time. Check frontend Render env.', true);
          return;
        }

        const selected = locationSelect.value;
        if (!selected) {
          setStatus('Please select a test location.', true);
          return;
        }

        button.disabled = true;
        setStatus('Sending test location…');

        sendLocation(parseLocation(selected));
      });
    </script>
  </body>
</html>
