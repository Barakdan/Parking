<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Can I Park Here?</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #111827;
      }

      main {
        width: min(100%, 40rem);
        padding: 2rem;
        text-align: center;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 5vw, 2.75rem);
        line-height: 1.05;
      }

      p {
        margin: 0;
        color: #475569;
      }

      .button-link {
        display: inline-flex;
        width: min(80vw, 20rem);
        aspect-ratio: 1 / 1;
        margin-top: 2rem;
        border-radius: 50%;
        background: #0f172a;
        color: #ffffff;
        text-decoration: none;
        font-weight: 700;
        font-size: clamp(1rem, 2vw, 1.3rem);
        justify-content: center;
        align-items: center;
        border: none;
        cursor: pointer;
        text-align: center;
        padding: 0;
      }

      .button-link:hover,
      .button-link:focus-visible {
        background: #111827;
        outline: none;
      }

      .button-link:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .location-select {
        display: block;
        width: min(100%, 22rem);
        margin: 1rem auto 0;
        padding: 0.85rem 1rem;
        border-radius: 1rem;
        border: 1px solid #cbd5e1;
        font-size: 1rem;
        color: #0f172a;
        background: #ffffff;
      }

      .note {
        margin-top: 1rem;
        color: #64748b;
        font-size: 0.95rem;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Can I Park Here?</h1>
      <p>Use a Tel Aviv test location and send it to the backend.</p>
      <label for="locationSelect" class="note">Select a Tel Aviv test location:</label>
      <select id="locationSelect" class="location-select">
        <option value="32.07501,34.77751">Dizengoff Square</option>
        <option value="32.06649,34.77750">Rothschild Boulevard</option>
        <option value="32.09019,34.77402">Tel Aviv Port</option>
      </select>
      <button id="checkButton" class="button-link" type="button">
        Check Parking Here
      </button>
      <input id="photoInput" type="file" accept="image/*" hidden />
      <p id="status" class="note">Checking configuration…</p>
    </main>
    <script type="module">
      const button = document.getElementById('checkButton');
      const status = document.getElementById('status');
      const locationSelect = document.getElementById('locationSelect');
      const apiUrl = import.meta.env.VITE_API_URL;

      function setStatus(message, isError = false) {
        status.textContent = message;
        status.style.color = isError ? '#b91c1c' : '#64748b';
      }

      function parseLocation(value) {
        const [lat, lng] = value.split(',').map((v) => Number(v.trim()));
        return { latitude: lat, longitude: lng };
      }

      setStatus(
        apiUrl
          ? 'Ready. Tap the button to send a Tel Aviv test location.'
          : 'VITE_API_URL is not configured at build time. Check frontend Render env.',
        !apiUrl
      );

      let photoRequired = false;
      let requestInFlight = false;
      const photoInput = document.getElementById('photoInput');

      async function readResponse(response) {
        const text = await response.text();
        if (!text) return {};
        try {
          return JSON.parse(text);
        } catch {
          throw new Error(`Backend returned an invalid response (${response.status}).`);
        }
      }

      function prepareImage(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onerror = () => reject(new Error('Could not read the selected photo.'));
          reader.onload = () => {
            const image = new Image();
            image.onerror = () => reject(new Error('The selected file is not a readable image.'));
            image.onload = () => {
              const maxDimension = 2200;
              const scale = Math.min(1, maxDimension / Math.max(image.width, image.height));
              const canvas = document.createElement('canvas');
              canvas.width = Math.max(1, Math.round(image.width * scale));
              canvas.height = Math.max(1, Math.round(image.height * scale));
              canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
              const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
              resolve({ mimeType: 'image/jpeg', base64: dataUrl.split(',')[1] ?? '' });
            };
            image.src = String(reader.result);
          };
          reader.readAsDataURL(file);
        });
      }

      async function sendLocation(position) {
        if (!apiUrl) {
          setStatus('VITE_API_URL is not configured. Check your build settings.', true);
          button.disabled = false;
          return;
        }

        const payload = {
          latitude: position.latitude,
          longitude: position.longitude,
          gpsAccuracyMeters: 10,
          isTelAvivResident: false,
          residentPermitZone: '',
          locationOnly: true,
        };

        try {
          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });

          const data = await readResponse(response);
          if (!response.ok) {
            setStatus(data.error || 'Parking check failed', true);
            return;
          }

          if (data.cacheHit) {
            setStatus('Cached sign found: ' + (data.message ?? 'parking evaluation returned'), false);
          } else if (data.needsPhoto) {
            photoRequired = true;
            button.textContent = 'Choose signpost photo';
            setStatus('Photo required. Take a new photo or choose an existing signpost photo.', false);
          } else {
            setStatus('Parking result: ' + JSON.stringify(data), false);
          }
        } catch (error) {
          setStatus(error instanceof Error ? error.message : 'Unable to reach backend', true);
        } finally {
          button.disabled = false;
        }
      }

      button.addEventListener('click', () => {
        if (requestInFlight) return;
        if (!apiUrl) {
          setStatus('VITE_API_URL is not configured at build time. Check frontend Render env.', true);
          return;
        }

        if (photoRequired) {
          photoInput.click();
          return;
        }

        const selected = locationSelect.value;
        if (!selected) {
          setStatus('Please select a test location.', true);
          return;
        }

        button.disabled = true;
        requestInFlight = true;
        setStatus('Sending test location…');

        sendLocation(parseLocation(selected)).finally(() => { requestInFlight = false; });
      });

      photoInput.addEventListener('change', async () => {
        if (requestInFlight) return;
        const file = photoInput.files?.[0];
        if (!file) {
          setStatus('No photo selected.', true);
          return;
        }

        if (!apiUrl) {
          setStatus('VITE_API_URL is not configured. Check your build settings.', true);
          return;
        }

        if (!file.type.startsWith('image/')) {
          setStatus('Please select an image file.', true);
          return;
        }

        requestInFlight = true;
        button.disabled = true;
        setStatus('Uploading signpost photo…');

        try {
            const preparedImage = await prepareImage(file);
            const response = await fetch(apiUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                latitude: parseLocation(locationSelect.value).latitude,
                longitude: parseLocation(locationSelect.value).longitude,
                gpsAccuracyMeters: 10,
                isTelAvivResident: false,
                residentPermitZone: '',
                locationOnly: false,
                signImages: [preparedImage],
              }),
            });

            const data = await readResponse(response);
            const geminiDetails = data.signAnalysis
              ? '\n\nGemini sign analysis:\n' + JSON.stringify(data.signAnalysis, null, 2)
              : '';
            if (!response.ok) {
              setStatus((data.error || 'Photo upload failed') + geminiDetails, true);
              photoRequired = true;
              button.textContent = 'Choose signpost photo';
              return;
            }

            if (data.needsPhoto || data.decision === 'uncertain') {
              setStatus(
                (data.explanation?.at(-1) || 'The photo could not be verified. Please upload a clear photo of the complete signpost.') + geminiDetails,
                true
              );
              photoRequired = true;
              button.textContent = 'Choose another signpost photo';
            } else {
              setStatus('Parking result: ' + JSON.stringify(data) + geminiDetails, false);
              photoRequired = false;
              button.textContent = 'Check Parking Here';
            }
          } catch (error) {
            setStatus(error instanceof Error ? error.message : 'Unable to reach backend', true);
            photoRequired = true;
            button.textContent = 'Choose signpost photo';
          } finally {
            requestInFlight = false;
            button.disabled = false;
            photoInput.value = '';
          }
      });
    </script>
  </body>
</html>
