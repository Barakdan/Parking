<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Can I Park Here?</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #111827;
      }

      main {
        width: min(100%, 40rem);
        padding: 2rem;
        text-align: center;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 5vw, 2.75rem);
        line-height: 1.05;
      }

      p {
        margin: 0;
        color: #475569;
      }

      .button-link {
        display: inline-flex;
        width: min(80vw, 20rem);
        aspect-ratio: 1 / 1;
        margin-top: 2rem;
        border-radius: 50%;
        background: #0f172a;
        color: #ffffff;
        text-decoration: none;
        font-weight: 700;
        font-size: clamp(1rem, 2vw, 1.3rem);
        justify-content: center;
        align-items: center;
        border: none;
        cursor: pointer;
        text-align: center;
        padding: 0;
      }

      .button-link:hover,
      .button-link:focus-visible {
        background: #111827;
        outline: none;
      }

      .button-link:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .note {
        margin-top: 1rem;
        color: #64748b;
        font-size: 0.95rem;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Can I Park Here?</h1>
      <p>Tap the button to share your location and check parking rules.</p>
      <button id="checkButton" class="button-link" type="button">
        Check Parking Here
      </button>
      <p id="status" class="note">Set VITE_API_URL in your Render env before building.</p>
    </main>
    <script type="module">
      const button = document.getElementById('checkButton');
      const status = document.getElementById('status');
      const apiUrl = import.meta.env.VITE_API_URL;

      function setStatus(message, isError = false) {
        status.textContent = message;
        status.style.color = isError ? '#b91c1c' : '#64748b';
      }

      async function sendLocation(position) {
        if (!apiUrl) {
          setStatus('VITE_API_URL is not configured. Check your build settings.', true);
          button.disabled = false;
          return;
        }

        const payload = {
          latitude: position.coords.latitude,
          longitude: position.coords.longitude,
          gpsAccuracyMeters: position.coords.accuracy,
          isTelAvivResident: false,
          residentPermitZone: '',
          locationOnly: true,
        };

        try {
          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });

          const data = await response.json();
          if (!response.ok) {
            setStatus(data.error || 'Parking check failed', true);
            return;
          }

          if (data.cacheHit) {
            setStatus('Cached sign found: ' + (data.message ?? 'parking evaluation returned'), false);
          } else if (data.needsPhoto) {
            setStatus('No cached sign nearby. Photo is needed.', false);
          } else {
            setStatus('Parking result: ' + JSON.stringify(data), false);
          }
        } catch (error) {
          setStatus(error instanceof Error ? error.message : 'Unable to reach backend', true);
        } finally {
          button.disabled = false;
        }
      }

      button.addEventListener('click', () => {
        if (!navigator.geolocation) {
          setStatus('Geolocation is not available in this browser.', true);
          return;
        }

        button.disabled = true;
        setStatus('Requesting location…');

        navigator.geolocation.getCurrentPosition(
          (position) => sendLocation(position),
          (error) => {
            setStatus(error.message || 'Location permission denied.', true);
            button.disabled = false;
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      });
    </script>
  </body>
</html>
